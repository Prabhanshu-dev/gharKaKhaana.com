spring:
  application:
    name: auth-service

  # ── Database — gkk_auth_db ─────────────────────────────────────────
  # All credentials injected from environment variables.
  # For local development, set these in your IDE run config or a .env file.
  datasource:
    url: ${DB_AUTH_URL:jdbc:mysql://localhost:3306/gkk_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_AUTH_USER:root}
    password: ${DB_AUTH_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # WARNING: update is for development sprint only.
      # Replace with Flyway/Liquibase in Phase 5 hardening.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# ── Server ─────────────────────────────────────────────────────────
server:
  port: 8081

# ── JWT Configuration ──────────────────────────────────────────────
# JWT_SECRET MUST match the value configured in api-gateway.
# Minimum 32 characters (256 bits). Use a cryptographically random value in production.
auth:
  jwt:
    secret: ${JWT_SECRET:ThisIsADevSecretKeyThatMustBeAtLeast256BitsLong!GKK2024}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # Default: 24 hours
