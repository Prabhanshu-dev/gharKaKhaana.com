spring:
  application:
    name: vendor-service

  # ── Database — gkk_vendor_db ────────────────────────────────────────
  datasource:
    url: ${DB_VENDOR_URL:jdbc:mysql://localhost:3306/gkk_vendor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_VENDOR_USER:root}
    password: ${DB_VENDOR_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # WARNING: update is for development sprint only.
      # Replace with Flyway/Liquibase in Phase 5 hardening.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# ── Server ─────────────────────────────────────────────────────────
server:
  port: 8082
